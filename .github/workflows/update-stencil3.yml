on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_stencil3]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: curl "https://github.com/MRT-Map/stencil3/raw/master/build/macos/brew.rb" -Lo Casks/stencil3.rb
    - run: echo "message=update @ $(date +%Y%m%dT%H:%M:%S%Z)" >> "$GITHUB_ENV"
    - uses: EndBug/add-and-commit@fc1cf1dd8747466e3313305ba0d26460c62a7e59 # v11.1.0
      with:
        default_author: github_actions
        message: ${{ env.message }}
